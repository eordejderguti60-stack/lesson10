<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forms</title>
</head>
<body>
    <form>

<fieldset>
<legend>Personal Information:</legend>

         <label for="firstname">First name:</label>
        <input type="text" name="firstname" id="firstname"><br>
        <label for="lastname">Last name:</label>
        <input type="text" name="lastname" id="lastname"><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email"><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" id="password"><br>
    <br>
        <input type="submit" value="Submit">
        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" id="phone" placeholder="0454838822">
      <br>
<label>Gender:</label><br>
<input type="radio" name="gender" value="male" id="male">
<label for="male">Male</label><br>
<input type="radio" name="gender" value="female" id="female">
<label for="female">Female</label><br>




<label>Hobbies:</label>
<input type="checkbox" name="gaming" value="gaming" id="gaming">
<label for="gaming">Gaming</label><br>
<input type="checkbox" name="football" id="football" value="football">
<label for="football">Football</label><br>
<input type="checkbox" name="Swimming" id="Swimming" value="Swimming">
<label for="Swimming">Swimming</label><br>


<select id="pet" name="pet">
  <option value="dog">Dog</option>
  <option value="cat">Cat</option>
  <option value="hamster">Hamster</option>
  <option value="parrot">Parrot</option>
  <option value="spider">Spider</option>
  <option value="goldfish">Goldfish</option>
</select><br>
<textarea name="message"  rows="10" cols="10"></textarea> <br><br>

    










<input type="submit" name="submit" value="Submit" id="submit">
</form>

</fieldset> 
</body>
</html>
